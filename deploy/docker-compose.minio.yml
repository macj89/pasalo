services:
  minio:
    image: minio/minio:latest
    container_name: pasalo-minio
    restart: unless-stopped
    env_file: ../.env.minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ../data/minio:/data
